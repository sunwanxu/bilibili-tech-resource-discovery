[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bilibili-hidden-knowledge-agent"
version = "1.0.0"
description = "Portable runtime for the Bilibili technical-resource discovery Skill"
requires-python = ">=3.11"
dependencies = [
  "openai>=2.0,<3",
  "playwright>=1.55,<2",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "tenacity>=9.0,<10",
  "yt-dlp>=2026.7.4",
]

[project.scripts]
bhka = "bhka.cli:main"
bhka-v1 = "bhka.v1.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bhka"]
