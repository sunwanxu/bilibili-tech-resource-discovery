[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bilibili-hidden-knowledge-agent"
version = "0.7.0"
description = "Phase-1 Bilibili technical-video value analyzer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=2.0,<3",
  "playwright>=1.55,<2",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
  "tenacity>=9.0,<10",
  "yt-dlp>=2026.7.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pyyaml>=6.0,<7", "ruff>=0.12,<1"]

[project.scripts]
bhka = "bhka.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bhka"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
